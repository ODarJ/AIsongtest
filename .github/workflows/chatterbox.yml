name: Chatterbox TTS on Colab GPU

on:
  workflow_dispatch:
    inputs:
      text:
        description: 'Poem text to synthesize'
        required: true
        default: 'Two roads diverged in a yellow wood, And sorry I could not travel both And be one traveler, long I stood And looked down one as far as I could To where it bent in the undergrowth;'

jobs:
  synthesize:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Colab CLI
        run: |
          pip install --user 'jupyter-kernel-client<1.0' google-colab-cli
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Write Colab ADC credentials
        env:
          COLAB_ADC_JSON: ${{ secrets.COLAB_ADC_CREDENTIALS }}
        run: |
          if [ -z "$COLAB_ADC_JSON" ]; then
            echo "::error::COLAB_ADC_CREDENTIALS secret is not set."
            exit 1
          fi
          mkdir -p "$HOME/.config/gcloud"
          printf '%s' "$COLAB_ADC_JSON" > "$HOME/.config/gcloud/application_default_credentials.json"

      - name: Provision Colab T4 session
        id: colab_new
        run: |
          SESSION="ci-${{ github.run_id }}"
          echo "session=$SESSION" >> "$GITHUB_OUTPUT"
          for attempt in 1 2 3; do
            if colab --auth=adc new -s "$SESSION" --gpu T4; then
              exit 0
            fi
            echo "::warning::colab new attempt $attempt failed; retrying in 60s..."
            sleep 60
          done
          echo "::error::colab new failed after 3 attempts"
          exit 1

      - name: Upload Python scripts to Colab
        run: |
          SESSION="${{ steps.colab_new.outputs.session }}"
          colab --auth=adc upload -s "$SESSION" colab_job/setup_chatterbox.py /content/setup_chatterbox.py
          colab --auth=adc upload -s "$SESSION" colab_job/generate_audio.py /content/generate_audio.py

      - name: Setup Chatterbox on Colab
        run: |
          set -o pipefail
          SESSION="${{ steps.colab_new.outputs.session }}"
          colab --auth=adc exec -s "$SESSION" -f /content/setup_chatterbox.py --timeout 1800 \
            2>&1 | tee /tmp/exec_setup.log
          if grep -q '^FATAL:' /tmp/exec_setup.log; then
            echo "::error::setup_chatterbox.py reported FATAL"
            exit 1
          fi

      - name: Generate Audio on Colab
        env:
          POEM_TEXT: ${{ github.event.inputs.text }}
        run: |
          set -o pipefail
          SESSION="${{ steps.colab_new.outputs.session }}"
          colab --auth=adc exec -s "$SESSION" -f /content/generate_audio.py --timeout 1800 \
            2>&1 | tee /tmp/exec_generate.log
          if grep -q '^FATAL:' /tmp/exec_generate.log; then
            echo "::error::generate_audio.py reported FATAL"
            exit 1
          fi

      - name: Download Audio
        run: |
          SESSION="${{ steps.colab_new.outputs.session }}"
          colab --auth=adc download -s "$SESSION" /content/output.wav ./output.wav
          ls -lh output.wav

      - name: Stop Colab session
        if: always()
        run: |
          SESSION="${{ steps.colab_new.outputs.session }}"
          colab --auth=adc stop -s "$SESSION" || true

      - name: Upload Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: chatterbox-audio
          path: output.wav