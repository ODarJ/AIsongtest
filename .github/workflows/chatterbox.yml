name: Chatterbox TTS on Colab GPU

on:
  workflow_dispatch:
    inputs:
      text:
        description: 'Poem text (use | between stanzas)'
        required: true
        default: 'The evening light falls soft and slow, Across the fields where wild grass grows. | A quiet wind begins to sing, Of distant hills and early spring. | The river carries all my dreams, Beyond the bend where silver gleams.'
      voice:
        description: 'Voice (file in voices/ folder)'
        required: true
        type: choice
        default: default
        options:
          - default
          - voice1
          - voice2

jobs:
  synthesize:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Colab CLI
        run: |
          pip install --user 'jupyter-kernel-client<1.0' google-colab-cli
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Write Colab ADC credentials
        env:
          COLAB_ADC_JSON: ${{ secrets.COLAB_ADC_CREDENTIALS }}
        run: |
          if [ -z "$COLAB_ADC_JSON" ]; then
            echo "::error::COLAB_ADC_CREDENTIALS secret is not set."
            exit 1
          fi
          mkdir -p "$HOME/.config/gcloud"
          printf '%s' "$COLAB_ADC_JSON" > "$HOME/.config/gcloud/application_default_credentials.json"

      - name: Provision Colab T4 session
        id: colab_new
        run: |
          SESSION="ci-${{ github.run_id }}"
          echo "session=$SESSION" >> "$GITHUB_OUTPUT"
          for attempt in 1 2 3; do
            if colab --auth=adc new -s "$SESSION" --gpu T4; then
              exit 0
            fi
            echo "::warning::colab new attempt $attempt failed; retrying in 60s..."
            sleep 60
          done
          echo "::error::colab new failed after 3 attempts"
          exit 1

      - name: Write poem text to file
        run: |
          cat > poem_text.txt << 'EOF'
          ${{ github.event.inputs.text }}
          EOF
          echo "--- poem_text.txt ---"
          cat poem_text.txt

      - name: Upload inputs to Colab
        run: |
          SESSION="${{ steps.colab_new.outputs.session }}"
          colab --auth=adc upload -s "$SESSION" poem_text.txt /content/poem_text.txt

      - name: Upload voice to Colab
        if: ${{ github.event.inputs.voice != 'default' }}
        run: |
          SESSION="${{ steps.colab_new.outputs.session }}"
          VOICE_FILE="voices/${{ github.event.inputs.voice }}.wav"
          if [ ! -f "$VOICE_FILE" ]; then
            echo "::error::$VOICE_FILE not found in repo"
            exit 1
          fi
          colab --auth=adc upload -s "$SESSION" "$VOICE_FILE" /content/voice.wav

      - name: Setup Chatterbox on Colab
        run: |
          set -o pipefail
          SESSION="${{ steps.colab_new.outputs.session }}"
          colab --auth=adc exec -s "$SESSION" -f setup_chatterbox.py --timeout 1800 \
            2>&1 | tee /tmp/exec_setup.log
          if grep -qE '^FATAL:|Traceback \(most recent call last\)' /tmp/exec_setup.log; then
            echo "::error::setup_chatterbox.py failed"
            exit 1
          fi

      - name: Generate Audio on Colab
        run: |
          set -o pipefail
          SESSION="${{ steps.colab_new.outputs.session }}"
          colab --auth=adc upload -s "$SESSION" generate_audio.py /content/generate_audio.py
          cat > run_generate.py << 'EOF'
          import subprocess, sys
          r = subprocess.run([sys.executable, '/content/generate_audio.py'],
                             capture_output=True, text=True)
          print("=== STDOUT ===", flush=True)
          print(r.stdout, flush=True)
          print("=== STDERR ===", flush=True)
          print(r.stderr[-6000:], flush=True)
          print(f"EXIT_CODE: {r.returncode}", flush=True)
          if r.returncode != 0:
              print("FATAL: generate_audio.py exited non-zero", flush=True)
          EOF
          colab --auth=adc exec -s "$SESSION" -f run_generate.py --timeout 1800 \
            2>&1 | tee /tmp/exec_generate.log
          if grep -qE '^FATAL:|Traceback \(most recent call last\)' /tmp/exec_generate.log; then
            echo "::error::generate step failed (see log above)"
            exit 1
          fi

      - name: Download Audio
        run: |
          SESSION="${{ steps.colab_new.outputs.session }}"
          colab --auth=adc download -s "$SESSION" /content/output.wav ./output.wav
          ls -lh output.wav

      - name: Stop Colab session
        if: always()
        run: |
          SESSION="${{ steps.colab_new.outputs.session }}"
          colab --auth=adc stop -s "$SESSION" || true

      - name: Upload Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: chatterbox-audio
          path: output.wav