name: Test F5 Myanmar TTS

on:
  workflow_dispatch:

jobs:
  tts:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install f5-myanmar-tts and fix audio backend
        run: |
          # 1. Install f5-myanmar-tts
          pip install f5-myanmar-tts
          
          # 2. Force CPU-only PyTorch to avoid CUDA conflicts
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          
          # 3. Uninstall torchcodec (This is the main culprit for the error)
          pip uninstall -y torchcodec
          
          # 4. Install soundfile as the fallback audio backend for torchaudio
          pip install soundfile

      - name: Run TTS
        run: |
          f5-myanmar "မင်္ဂလာပါ ခင်ဗျာ။ ဒီအသံက GitHub Actions ကနေ ဖန်တီးထားတာပါ။" -o output.wav

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: myanmar-tts-output
          path: output.wav