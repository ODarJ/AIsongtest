name: Test F5 Myanmar TTS

on:
  workflow_dispatch:

jobs:
  tts:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsndfile1

      - name: Install f5-myanmar-tts and fix audio backend
        run: |
          pip install f5-myanmar-tts
          # Uninstall torchcodec to prevent CUDA library errors
          pip uninstall -y torchcodec
          # Install soundfile as the audio backend replacement
          pip install soundfile

      - name: Run TTS with custom audio loader
        run: |
          python -c "
          import torch
          import torchaudio
          import soundfile as sf

          # 1. Monkeypatch torchaudio.load to use soundfile instead of torchcodec
          def soundfile_load(filepath, *args, **kwargs):
              data, samplerate = sf.read(filepath)
              tensor = torch.from_numpy(data).float()
              if len(tensor.shape) == 1:
                  tensor = tensor.unsqueeze(0)
              else:
                  tensor = tensor.t()
              return tensor, samplerate

          torchaudio.load = soundfile_load

          # 2. Run the TTS
          from f5_myanmar_tts import MyanmarTTS
          tts = MyanmarTTS()
          tts.speak(
              'မင်္ဂလာပါ ခင်ဗျာ။ ဒီအသံက GitHub Actions ကနေ ဖန်တီးထားတာပါ။',
              output_file='output.wav'
          )
          print('Audio generated successfully!')
          "

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: myanmar-tts-output
          path: output.wav