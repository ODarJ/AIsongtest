name: Test F5 Myanmar TTS Custom Male Voice

on:
  workflow_dispatch:

jobs:
  tts:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsndfile1

      - name: Install Myanmar TTS
        run: |
          python -m pip install --upgrade pip
          python -m pip install f5-myanmar-tts soundfile numpy

      - name: Check reference voice
        run: |
          python - <<'PY'
          import os
          import soundfile as sf

          path = "voices/myanmarvoice_f5_sample.wav"

          if not os.path.isfile(path):
              raise FileNotFoundError(
                  f"Reference voice not found: {path}"
              )

          info = sf.info(path)
          print(info)

          if info.frames == 0:
              raise RuntimeError("Reference audio is empty")

          if info.channels != 1:
              raise RuntimeError("Reference audio must be mono")

          if info.samplerate != 24000:
              raise RuntimeError(
                  f"Expected 24000 Hz, got {info.samplerate} Hz"
              )

          print("Reference audio check passed.")
          PY

      - name: Generate Myanmar speech
        run: |
          python - <<'PY'
          import os
          import soundfile as sf
          from f5_myanmar_tts import MyanmarTTS

          reference_audio = "voices/myanmarvoice_f5_sample.wav"

          reference_text = (
              "မြန်မာနိုင်ငံအထက်ပိုင်းကရွာငယ်လေးတစ်ရွာမှာ "
              "အဘိုးဦးဘသာဆိုတဲ့လူအိုကြီးတစ်ယောက်ရှိပါတယ် "
              "သူ့မှာအလွန်ရှေးကျတဲ့ကျေးခေါင်းလောင်းလေးတစ်လုံးရှိပြီး"
          )

          target_text = """
          ရှေးဟောင်းကျေးခေါင်းလောင်းလေး၏ လျှို့ဝှက်ချက်

          တစ်ခါတုန်းက မြန်မာနိုင်ငံအထက်ပိုင်းက တောင်တန်းတွေနဲ့
          ဝန်းရံထားတဲ့ ရွာငယ်လေးတစ်ရွာမှာ အဘိုးဦးဘသာဆိုတဲ့
          လူအိုကြီးတစ်ယောက် နေထိုင်ခဲ့ပါတယ်။

          အဘိုးဦးဘသာဟာ တစ်ရွာလုံးမှာ ဉာဏ်ပညာအရှိဆုံး
          လူတစ်ယောက်ဖြစ်ပေမဲ့ စကားနည်းပြီး လူတွေနဲ့
          သိပ်မရောနှောတတ်ပါဘူး။ သူ့အိမ်လေးဟာ ရွာအပြင်ဘက်က
          ညောင်ပင်အိုကြီးတစ်ပင်အနီးမှာ ရှိပါတယ်။

          အဘိုးဦးဘသာရဲ့ အိမ်ထဲမှာ လူတိုင်းစိတ်ဝင်စားကြတဲ့
          ပစ္စည်းတစ်ခု ရှိနေပါတယ်။ အဲဒါကတော့ ရှေးနှစ်ပေါင်းများစွာ
          သက်တမ်းရှိနေပြီဖြစ်တဲ့ ကြေးခေါင်းလောင်းလေးတစ်လုံးပါပဲ။

          ထူးဆန်းတာက အဲဒီခေါင်းလောင်းလေးဟာ ဘယ်သူကမှ မထိဘဲ
          ညသန်းခေါင်အချိန်ရောက်တိုင်း သူ့အလိုလို မြည်တတ်တာပါ။

          တစ်ညမှာ ခေါင်းလောင်းသံကို ကြားလိုက်ရတဲ့
          အဘိုးဦးဘသာဟာ ရုတ်တရက် အိပ်ရာကနေ ထလာခဲ့ပါတယ်။
          သူ့မျက်နှာပေါ်မှာ စိုးရိမ်ပူပန်မှုတွေ ပြည့်နှက်နေခဲ့တယ်။

          နောက်ဆုံးတော့ အချိန်ကျလာပြီပေါ့လေ…

          အဘိုးကြီးဟာ တိုးတိုးလေး ရေရွတ်လိုက်ပါတယ်။

          နောက်တစ်နေ့မနက်မှာတော့ ရွာထဲက လူငယ်တစ်ယောက်ဖြစ်တဲ့
          မောင်လှမင်းဟာ အဘိုးဦးဘသာဆီကို ရောက်လာခဲ့ပါတယ်။
          မောင်လှမင်းဟာ စူးစမ်းလိုစိတ်ပြင်းပြပြီး ဘယ်အရာကိုမှ
          အလွယ်တကူ လက်မလျှော့တတ်တဲ့ လူငယ်တစ်ယောက်ပါ။

          အဘိုး၊ ညတိုင်း မြည်နေတဲ့ ခေါင်းလောင်းက ဘာကြောင့်လဲဗျ။
          အဲဒီခေါင်းလောင်းမှာ လျှို့ဝှက်ချက်တစ်ခုခု ရှိနေသလား။

          အဘိုးဦးဘသာဟာ ခေါင်းလောင်းလေးကို ငေးကြည့်ရင်း
          ခဏလောက် တိတ်ဆိတ်နေခဲ့ပါတယ်။

          ပြီးမှ သူက မောင်လှမင်းကို မျက်လုံးချင်းဆုံပြီး ပြောလိုက်ပါတယ်။

          ဒီခေါင်းလောင်းဟာ သာမန်ခေါင်းလောင်း မဟုတ်ဘူးကွ။
          လွန်ခဲ့တဲ့ နှစ်ပေါင်းတစ်ရာကျော်က ဒီရွာမှာ ဖြစ်ပျက်ခဲ့တဲ့
          အဖြစ်အပျက်တစ်ခုကို ဖုံးကွယ်ထားတဲ့ သက်သေတစ်ခုပဲ။

          အဘိုးဦးဘသာရဲ့ စကားကို ကြားလိုက်ရတဲ့အခါ
          မောင်လှမင်းရဲ့ စိတ်ထဲမှာ သိချင်စိတ်တွေ
          ပိုမိုပြင်းထန်လာခဲ့ပါတယ်။

          အဲဒီညမှာ မောင်လှမင်းဟာ အဘိုးဦးဘသာနဲ့အတူ
          ခေါင်းလောင်းလေး မြည်မယ့်အချိန်ကို စောင့်နေခဲ့ပါတယ်။

          ညသန်းခေါင်အချိန်တိတိ ရောက်လာတဲ့အခါ
          ခေါင်းလောင်းလေးဟာ တစ်ချက်၊ နှစ်ချက်၊ သုံးချက်
          မြည်လာခဲ့ပါတယ်။

          ခေါင်းလောင်းသံ နောက်ဆုံးတစ်ချက် ထွက်ပေါ်လာချိန်မှာတော့
          အိမ်အနောက်ဘက်က ကြမ်းပြင်အောက်ကနေ
          ထူးဆန်းတဲ့ အသံတစ်ခု ကြားလိုက်ရပါတယ်။

          အဘိုးဦးဘသာဟာ ချက်ချင်း မီးအိမ်ကို ကောက်ယူပြီး
          ကြမ်းပြင်ဟောင်းကို ဖယ်ရှားလိုက်ပါတယ်။
          အောက်မှာတော့ မြေကြီးထဲကို ဆင်းသွားတဲ့
          ကျောက်လှေကားတစ်ခု ပေါ်လာခဲ့ပါတယ်။

          အဘိုး၊ အဲဒီအောက်မှာ ဘာရှိတာလဲ။

          မောင်လှမင်းက တုန်လှုပ်နေတဲ့ အသံနဲ့ မေးလိုက်ပါတယ်။

          အဘိုးဦးဘသာက အသက်ပြင်းပြင်းတစ်ချက် ရှူလိုက်ပြီး
          ပြန်ဖြေခဲ့ပါတယ်။

          ဒီရွာရဲ့ အတိတ်အမှန်တရားပဲကွ။
          ဒါပေမဲ့ အဲဒီအမှန်တရားကို သိသွားရင်
          မင်းဘဝတစ်ခုလုံး ပြောင်းလဲသွားနိုင်တယ်။

          မောင်လှမင်းဟာ ခဏလောက် စဉ်းစားနေခဲ့ပေမဲ့
          နောက်ဆုံးမှာတော့ အဘိုးနောက်ကို လိုက်ဖို့ ဆုံးဖြတ်လိုက်ပါတယ်။

          သူတို့နှစ်ယောက်ဟာ မီးအိမ်ကို ကိုင်ပြီး
          ကျောက်လှေကားအတိုင်း ဖြည်းဖြည်းချင်း ဆင်းသွားခဲ့ကြပါတယ်။

          အောက်ဆုံးကို ရောက်တဲ့အခါ သူတို့ရှေ့မှာ
          ကျောက်တံခါးကြီးတစ်ခု ပေါ်လာခဲ့ပါတယ်။
          တံခါးအလယ်မှာတော့ ခေါင်းလောင်းပေါ်က သင်္ကေတနဲ့
          တစ်ထပ်တည်းတူညီတဲ့ သင်္ကေတတစ်ခု ရေးထွင်းထားပါတယ်။

          အဘိုးဦးဘသာဟာ ခေါင်းလောင်းလေးကို
          တံခါးအလယ်က အပေါက်ငယ်ထဲမှာ ထည့်လိုက်ပါတယ်။

          ချက်ချင်းဆိုသလို ကျောက်တံခါးကြီးဟာ တုန်ခါလာပြီး
          ဖြည်းဖြည်းချင်း ပွင့်သွားခဲ့ပါတယ်။

          တံခါးအတွင်းမှာ ရွှေငွေရတနာတွေ၊ ရှေးဟောင်းစာအုပ်တွေ၊
          မြေပုံဟောင်းတစ်ချပ်နဲ့ စာတစ်စောင် ရှိနေခဲ့ပါတယ်။

          မောင်လှမင်းဟာ စာကို ကောက်ယူပြီး
          မီးအိမ်အလင်းရောင်အောက်မှာ ဖတ်လိုက်ပါတယ်။

          ဤရတနာများသည် တစ်ဦးတစ်ယောက်တည်း ပိုင်ဆိုင်ရန် မဟုတ်။
          ဘေးအန္တရာယ် ကျရောက်လာသောအခါ
          ရွာသူရွာသားများ၏ အသက်ကို ကယ်တင်ရန်
          ထားခဲ့ခြင်းဖြစ်သည်။
          ရတနာကို ရှာဖွေသူသည် မိမိအကျိုးအတွက်သာ
          အသုံးပြုမည်ဆိုလျှင် ဤရွာ၏ ကံကြမ္မာ ပျက်စီးလိမ့်မည်။

          စာကို ဖတ်ပြီးတဲ့အခါ မောင်လှမင်းဟာ
          အဘိုးဦးဘသာကို မေးလိုက်ပါတယ်။

          အဘိုး၊ ဒီရတနာတွေကို အဘိုးက ဘာလို့ အခုမှ ဖွင့်ပြတာလဲ။

          အဘိုးဦးဘသာဟာ ပြုံးလိုက်ပါတယ်။

          ငါ့ဘိုးဘေးတွေက ဒီလျှို့ဝှက်ချက်ကို
          မျိုးဆက်တစ်ဆက်ပြီးတစ်ဆက် ထိန်းသိမ်းလာခဲ့ကြတာကွ။
          ဒါပေမဲ့ ငါ့အသက်လည်း ကြီးလာပြီ။
          ဒီရွာရဲ့ အနာဂတ်ကို တာဝန်ယူနိုင်မယ့်သူတစ်ယောက်
          လိုအပ်နေပြီလေ။

          မောင်လှမင်းဟာ ရတနာတွေကို ငေးကြည့်ပြီး
          ခဏလောက် တိတ်ဆိတ်နေခဲ့ပါတယ်။
          နောက်ဆုံးမှာတော့ သူက အဘိုးဦးဘသာကို ပြောလိုက်ပါတယ်။

          ဒီရတနာတွေကို ကျွန်တော်တစ်ယောက်တည်း မယူပါဘူး အဘိုး။
          ရွာမှာ ရေတွင်းတွေ ဆောက်မယ်။
          ဆင်းရဲတဲ့ မိသားစုတွေကို ကူညီမယ်။
          ကလေးတွေအတွက် စာသင်ကျောင်းလည်း ဆောက်ပေးမယ်။

          အဘိုးဦးဘသာဟာ အဲဒီစကားကို ကြားလိုက်ရတဲ့အခါ
          မျက်လုံးထဲမှာ မျက်ရည်တွေ ဝဲလာခဲ့ပါတယ်။

          ဒါဆိုရင်တော့ ငါ့တာဝန် ပြီးဆုံးသွားပြီပေါ့ကွာ။

          အဲဒီညနောက်ပိုင်းမှာတော့ ရှေးဟောင်းခေါင်းလောင်းလေးဟာ
          ဘယ်တော့မှ ထပ်မမြည်တော့ပါဘူး။

          မောင်လှမင်းဟာ ရတနာတွေကို ရွာသူရွာသားတွေအတွက်
          အသုံးပြုခဲ့ပြီး သူတို့ရွာလေးဟာ တဖြည်းဖြည်း
          ဖွံ့ဖြိုးတိုးတက်လာခဲ့ပါတယ်။

          အဘိုးဦးဘသာကတော့ ညောင်ပင်အိုကြီးအောက်မှာ ထိုင်ရင်း
          ရွာက ကလေးတွေ ပျော်ရွှင်စွာ ကစားနေကြတာကို
          နေ့တိုင်း ကြည့်ရှုနေခဲ့ပါတယ်။

          သူသိနေခဲ့တာတစ်ခုကတော့ ရွာကို တကယ်ကယ်တင်ပေးခဲ့တာဟာ
          ရွှေငွေရတနာတွေ မဟုတ်ဘဲ လူတစ်ယောက်ရဲ့ စိတ်ထားကောင်းနဲ့
          မှန်ကန်တဲ့ ဆုံးဖြတ်ချက်ပဲ ဖြစ်ပါတယ်။

          ပုံပြင်လေးရဲ့ သင်ခန်းစာကတော့ —
          တကယ့်ရတနာဆိုတာ ရွှေငွေတွေ မဟုတ်ပါဘူး။
          ကိုယ့်အကျိုးထက် အများအကျိုးကို ဦးစားပေးတတ်တဲ့
          စိတ်ထားကသာ အဖိုးတန်ဆုံး ရတနာဖြစ်ပါတယ်။
          """

          tts = MyanmarTTS()

          tts.speak(
              target_text,
              ref_audio=reference_audio,
              ref_text=reference_text,
              output_file="output.wav"
          )

          if not os.path.isfile("output.wav"):
              raise RuntimeError(
                  "TTS did not create output.wav"
              )

          info = sf.info("output.wav")

          if info.frames == 0:
              raise RuntimeError("Generated audio is empty")

          print(f"Generated audio: {info}")
          PY

      - name: Upload generated audio
        uses: actions/upload-artifact@v4
        with:
          name: myanmar-tts-custom-male-voice
          path: output.wav
          if-no-files-found: error
          retention-days: 7